<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALEXTATANE — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#ff2b45;
    --red-soft:#ff6b6b;
    --bg:#050506;
    --line:rgba(255,255,255,.08);
    --txt:#f2f2f5;
    --mute:#8a8a96;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --spring:cubic-bezier(.2,.9,.25,1.25);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--txt);font-family:Sora,system-ui,sans-serif;min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  a{color:inherit;text-decoration:none}

  body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7) 100%)}
  body::before{content:"";position:fixed;inset:0;z-index:1;opacity:.35;pointer-events:none;
    background:radial-gradient(60% 45% at 85% 60%,rgba(255,43,69,.10),transparent 70%),radial-gradient(45% 35% at 50% 0%,rgba(255,43,69,.08),transparent 70%)}
  #stars,#fx{position:fixed;inset:0;pointer-events:none}
  #stars{z-index:40;opacity:.03;mix-blend-mode:screen} #fx{z-index:30}

  /* nav */
  nav{position:relative;z-index:5;max-width:1180px;margin:0 auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
  .brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
  .brand i{color:var(--red);font-style:normal}
  .navbtn{display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(10,10,14,.6);backdrop-filter:blur(8px);transition:border-color .3s,box-shadow .3s,transform .4s var(--spring)}
  .navbtn:hover{border-color:rgba(255,43,69,.5);box-shadow:0 0 24px rgba(255,43,69,.18);transform:translateY(-2px)}
  .navbtn:active{transform:scale(.96)}
  .navbtn span{color:var(--red);transition:transform .4s var(--spring)}
  .navbtn:hover span{transform:translate(3px,-3px)}

  main{position:relative;z-index:5;max-width:580px;margin:0 auto;padding:36px 20px 40px}

  /* avatar + orbits */
  .hero{text-align:center}
  .orbit-wrap{position:relative;width:170px;height:170px;margin:0 auto 22px}
  /* rotating gradient border */
  .halo{position:absolute;left:50%;top:50%;width:152px;height:152px;margin:-76px 0 0 -76px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--red),#ff8a5c,#fff,#ff2b45,#5a0612,var(--red));
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
    filter:drop-shadow(0 0 8px rgba(255,43,69,.8));animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{position:absolute;left:50%;top:50%;width:200px;height:200px;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;
    background:#0b0b0f;border:2px solid #0b0b0f;display:grid;place-items:center;box-shadow:0 0 30px rgba(255,43,69,.35);}
  @keyframes avglow{50%{box-shadow:0 0 50px rgba(255,43,69,.6)}}
  .avatar span{font-weight:800;font-size:44px;letter-spacing:-.04em;background:linear-gradient(135deg,#fff 20%,var(--red) 110%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .avatar img{width:100%;height:100%;object-fit:cover;transform:translateY(3px) scale(1.06)}

  h1{font-family:Anton,Sora,sans-serif;font-weight:400;font-size:clamp(48px,13vw,88px);letter-spacing:.03em;line-height:1;text-transform:uppercase;
    background:linear-gradient(100deg,#fff 0%,#ffd3d6 30%,var(--red-soft) 60%,var(--red) 100%);background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 8s ease-in-out infinite}
  @keyframes sheen{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .meta{margin-top:16px;display:flex;justify-content:center;align-items:center;gap:16px;font-family:var(--mono);font-size:12px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}
  .meta .live{color:var(--red);letter-spacing:.1em;display:inline-flex;align-items:center;gap:7px;font-size:11px}
  .meta .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:blink 2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.3}}

  /* ============ LINK BLOCKS ============ */
  .list{display:flex;flex-direction:column;gap:12px;margin-top:48px}
  .item{--mx:50%;--my:50%;--rx:0deg;--ry:0deg;--ty:0px;--s:1;
    position:relative;display:flex;align-items:center;gap:16px;padding:16px 20px 16px 18px;border-radius:16px;
    background:rgba(255,255,255,.025);border:1px solid var(--line);overflow:hidden;isolation:isolate;cursor:pointer;user-select:none;
    transform:perspective(900px) translate3d(0,var(--ty),0) rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--s));
    transition:transform .55s var(--spring),background .4s,border-color .4s,box-shadow .4s,opacity .7s var(--ease);
    will-change:transform}
  .item.hide{opacity:0;--ty:22px;--s:.97}
  .item.moving{transition:transform .18s var(--ease),background .4s,border-color .4s,box-shadow .4s,opacity .7s}
  /* glow that follows the cursor */
  .item::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .4s;
    background:radial-gradient(260px circle at var(--mx) var(--my),rgba(255,43,69,.16),transparent 65%)}
  /* border that lights up under the cursor */
  .item::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;opacity:0;transition:opacity .4s;pointer-events:none;
    background:radial-gradient(180px circle at var(--mx) var(--my),rgba(255,90,105,.95),rgba(255,43,69,.25) 45%,transparent 70%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
  .item .shine{position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.07) 50%,transparent 65%);transform:translateX(-110%)}

  @media (hover:hover){
    .item:hover{--ty:-4px;--s:1.015;background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.04);box-shadow:0 18px 40px -12px rgba(0,0,0,.8),0 0 40px -10px rgba(255,43,69,.35)}
    .item:hover::before,.item:hover::after{opacity:1}
    .item:hover .shine{transform:translateX(110%);transition:transform .9s var(--ease)}
    .item:hover .ico{transform:scale(1.12) rotate(-7deg);box-shadow:0 8px 24px -4px var(--glow,rgba(255,43,69,.5))}
    .item:hover .chev{color:#fff;background:var(--red);border-color:var(--red);box-shadow:0 0 18px rgba(255,43,69,.6)}
    .item:hover .chev svg{transform:translateX(0)}
    .item:hover .chev svg+svg{transform:translateX(220%)}
    .item:hover .txt b{transform:translateX(3px)}
    .item:hover .txt small{color:#b4b4bf;transform:translateX(3px)}
  }
  .item.press{--s:.965;--ty:0px;transition:transform .12s var(--ease),background .3s,border-color .3s}
  .item.press .ico{transform:scale(.9) rotate(0)}

  .ico{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;transition:transform .5s var(--spring),box-shadow .4s}
  .ico svg{width:22px;height:22px}
  .ico img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
  .txt{flex:1;min-width:0}
  .txt b{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15.5px;letter-spacing:-.01em;transition:transform .45s var(--spring)}
  .txt small{display:block;font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-top:5px;letter-spacing:.02em;transition:transform .45s var(--spring) .03s,color .3s}
  .chev{flex:none;position:relative;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;color:#666670;transition:background .35s,border-color .35s,color .35s,box-shadow .35s}
  .chev svg{position:absolute;width:13px;height:13px;transition:transform .45s var(--spring)}
  .chev svg:first-child{transform:translateX(-220%)}
  .tag{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.1em;padding:3px 7px;border-radius:6px;color:var(--red);border:1px solid rgba(255,43,69,.4);background:rgba(255,43,69,.08);animation:tagpulse 2.4s ease-in-out infinite}
  @keyframes tagpulse{50%{box-shadow:0 0 12px rgba(255,43,69,.45)}}

  .ripple{position:absolute;z-index:-1;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,43,69,.45),rgba(255,43,69,0) 70%);transform:translate(-50%,-50%) scale(0);animation:rip .7s var(--ease) forwards}
  @keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

  /* icon colors */
  .i-tt{background:#111;border:1px solid rgba(255,255,255,.1);--glow:rgba(37,244,238,.45)}
  .i-ig{background:linear-gradient(45deg,#f9a03f 0%,#e1306c 50%,#833ab4 100%);--glow:rgba(225,48,108,.55)}
  .i-cash{background:linear-gradient(135deg,#1db954,#0a6b2c);--glow:rgba(29,185,84,.55)}
  .i-star{background:linear-gradient(135deg,#4f8ff7,#7d6cf2);--glow:rgba(110,120,250,.55)}
  .i-red{background:linear-gradient(135deg,var(--red),#8a0d1d);--glow:rgba(255,43,69,.6)}
  .i-film{background:#16161c;border:1px solid rgba(255,255,255,.1);--glow:rgba(255,255,255,.25)}
  .i-white{background:#fff;--glow:rgba(255,255,255,.35)}
  .i-js{background:none;overflow:hidden;--glow:rgba(255,43,69,.65)}
  .i-pp{background:linear-gradient(135deg,#0070e0,#003087);--glow:rgba(0,112,224,.6)}

  /* about card */
  .about{margin-top:48px;padding:34px 28px;border-radius:20px;text-align:center;border:1px solid rgba(255,43,69,.22);background:linear-gradient(160deg,rgba(255,255,255,.03),rgba(255,43,69,.07))}
  .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.3em;color:var(--red);text-transform:uppercase}
  .about h2,.promo h2{font-weight:700;font-size:28px;letter-spacing:-.03em;margin:12px 0 14px}
  .about p{color:#a9a9b4;font-size:14.5px;line-height:1.75;max-width:440px;margin:0 auto}
  .about p b{color:#fff;font-weight:600}

  .promo{margin-top:56px;padding-top:48px;border-top:1px solid var(--line);text-align:center}
  .promo p{color:#a9a9b4;font-size:14.5px}
  .promo a{display:inline-flex;align-items:center;gap:12px;margin-top:26px;font-weight:600;font-size:15px;padding:14px 22px;border-radius:14px;border:1px solid rgba(255,43,69,.4);transition:background .35s,border-color .35s,box-shadow .35s,transform .45s var(--spring)}
  .promo a span{color:var(--red);transition:transform .45s var(--spring),color .3s}
  .promo a:hover{background:var(--red);border-color:var(--red);box-shadow:0 0 34px rgba(255,43,69,.45);transform:translateY(-3px)}
  .promo a:hover span{color:#fff;transform:translate(3px,-3px)}
  .promo a:active{transform:scale(.96)}

  footer{text-align:center;margin-top:64px;font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:#55555f}
  footer b{color:var(--red);font-weight:500}

  .fx{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s var(--ease)}
  .fx.in{opacity:1;transform:none}

  @media (max-width:520px){ nav{padding:16px 18px} .navbtn{padding:10px 13px;font-size:12px} .about{padding:28px 20px} }
  @media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} .fx,.item.hide{opacity:1;transform:none} }
</style>

  <!-- ===== INTRO ANIMATION — rap clip style (paste right after <body>) ===== -->
<style>
  #intro{position:fixed;inset:0;z-index:9999;background:#000;display:grid;place-items:center;overflow:hidden;cursor:pointer}
  #intro::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
    background:repeating-linear-gradient(to bottom,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
  #intro .flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:5;pointer-events:none}
  #intro .flash.red{background:#ff2b45}
  #intro .word{position:relative;z-index:4;display:flex;font-family:Anton,Impact,sans-serif;font-size:clamp(46px,14vw,120px);letter-spacing:.04em;line-height:1;color:#fff}
  #intro .word{opacity:0}
  #intro .word.show{opacity:1;animation:slam .3s cubic-bezier(.2,.9,.3,1.2) forwards}
  #intro .big{position:absolute;z-index:4;font-family:Anton,Impact,sans-serif;font-size:clamp(160px,55vw,420px);line-height:1;color:#fff;opacity:0;
    text-shadow:0 0 10px rgba(255,43,69,.9),0 0 40px rgba(255,43,69,.6)}
  #intro .big.on{animation:slam .2s cubic-bezier(.2,.9,.3,1.2) forwards}
  @keyframes slam{0%{opacity:1;transform:scale(3.2);filter:blur(10px)}70%{transform:scale(.92);filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0);
    text-shadow:0 0 6px rgba(255,43,69,.9),0 0 22px rgba(255,43,69,.6)}}
  #intro.shake .word{animation:shake .14s linear}
  @keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-4px)}75%{transform:translate(-3px,-2px)}100%{transform:translate(0,0)}}
  /* RGB split glitch at the end */
  #intro.glitch .word{animation:rgb .45s steps(2) infinite}
  @keyframes rgb{0%{text-shadow:-5px 0 #ff2b45,5px 0 #25f4ee;transform:translate(0,0) skewX(0)}
    25%{text-shadow:6px 0 #ff2b45,-6px 0 #25f4ee;transform:translate(-4px,2px) skewX(-6deg)}
    50%{text-shadow:-3px 0 #ff2b45,3px 0 #25f4ee;transform:translate(3px,-1px) skewX(4deg)}
    75%{text-shadow:8px 0 #ff2b45,-8px 0 #25f4ee;transform:translate(-2px,0) skewX(0)}
    100%{text-shadow:-5px 0 #ff2b45,5px 0 #25f4ee;transform:translate(0,0)}}
  #intro.out{animation:introOut .45s ease forwards}
  @keyframes introOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
  #intro.gone{display:none}
  @media (prefers-reduced-motion:reduce){#intro{display:none}}
</style>
<div id="intro">
  <div class="big" id="introBig"></div>
  <div class="word" id="introWord">ALEXTATANE</div>
  <div class="flash" id="introFlash"></div>
</div>
<script>
(function(){
  const TEXT="ALEXTATANE";          // text of the intro
  const STEP=150;                   // ms each letter stays on screen
  const el=document.getElementById('intro'), w=document.getElementById('introWord'), big=document.getElementById('introBig'), fl=document.getElementById('introFlash');
  w.textContent=TEXT; const letters=[...TEXT]; let timers=[], done=false;
  const at=(ms,fn)=>timers.push(setTimeout(fn,ms));
  function flash(op,dur,red){ fl.classList.toggle('red',!!red); fl.style.transition='none'; fl.style.opacity=op;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ fl.style.transition=`opacity ${dur}ms ease-out`; fl.style.opacity=0; })); }
  function shake(){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

  // 2. one letter at a time: each one replaces the previous, with a flash + shake
  const start=0;
  letters.forEach((c,i)=>at(start+i*STEP,()=>{
    big.classList.remove('on'); void big.offsetWidth; big.textContent=c; big.classList.add('on');
    flash(i%3===0?.6:.3,130,i%2===1); shake(); }));
  const end=start+letters.length*STEP;
  // 3. full name slams in, glitch + strobe, then big white flash and cut to the site
  at(end,()=>{ big.style.display='none'; w.classList.add('show'); flash(1,160); shake(); });
  at(end+260,()=>{ el.classList.add('glitch'); flash(.6,90,true); });
  at(end+420,()=>flash(.8,90));
  at(end+620,()=>flash(.5,90,true));
  at(end+900,finish);
  function finish(){ if(done) return; done=true; timers.forEach(clearTimeout);
    el.classList.remove('glitch'); flash(1,380); el.classList.add('out'); setTimeout(()=>el.classList.add('gone'),460); }
  el.addEventListener('click',finish); // tap to skip
})();
</script>

};
const LINKS = [
  {title:"TikTok",                    sub:"@alextatanee_",            icon:"tiktok", cls:"i-tt",   img:"", url:"https://www.tiktok.com/@alextatanee_"},
  {title:"Instagram",                 sub:"DM for promos here",       icon:"insta",  cls:"i-ig",   img:"", url:"https://www.instagram.com/alextatanee/"},
  {title:"1K Views = $1",  sub:"Create your account",      icon:"bolt",   cls:"i-cash", img:IMG.views, url:"https://seeder.gg/r/alextatanee"},
  {title:"My Quality",                sub:"Settings for max quality", icon:"star",   cls:"i-star", img:IMG.quality, url:"https://payhip.com/alextatanee"},
  {title:"Portfolio",                 sub:"About me",                 icon:"play",   cls:"i-red",  img:"", url:"https://alextatane.github.io/alextatanee.github.io/"},
  {title:"Donate",                    sub:"Support me via PayPal",    icon:"paypal", cls:"i-white", img:IMG.paypal, url:"https://paypal.me/AlexyTitren"},
  {title:"All Jason Statham Movies",  sub:"Every movie I edit",       icon:"film",   cls:"i-js", img:"statha1.jpg", url:"https://spotted-goose-abb.notion.site/All-Jason-Statham-Movies-I-Edit-23ec407e8adb80a09dccd1f3f9f65482"}
];
const BUSINESS_URL = "https://www.instagram.com/alextatanee/";
const AVATAR_IMG = "pp.jpg.png";   // optional: your profile picture

/* ---------- build ---------- */
const arrow='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const list=document.getElementById('list');
list.innerHTML=LINKS.map(l=>`
  <a class="item hide" href="${l.url}" target="_blank" rel="noopener">
    <span class="shine"></span>
    <div class="ico ${l.cls}">${l.img?`<img src="${l.img}" alt="">`:ICONS[l.icon]}</div>
    <div class="txt"><b>${l.title}${l.tag?` <span class="tag">${l.tag}</span>`:''}</b><small>${l.sub}</small></div>
    <span class="chev">${arrow}${arrow}</span>
  </a>`).join('');
document.getElementById('l-business').href=BUSINESS_URL;
document.getElementById('l-business-top').href=BUSINESS_URL;
if(AVATAR_IMG) document.querySelector('.avatar').innerHTML=`<img src="${AVATAR_IMG}" alt="alextatane">`;
document.getElementById('yr').textContent=new Date().getFullYear();

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const canHover=matchMedia('(hover:hover)').matches;

/* ---------- entrance ---------- */
const fx=[...document.querySelectorAll('.fx')];
const items=[...document.querySelectorAll('.item')];
if(reduce){ fx.forEach(e=>e.classList.add('in')); items.forEach(e=>e.classList.remove('hide')); }
else{
  fx.forEach((e,i)=>setTimeout(()=>e.classList.add('in'),80+i*90));
  items.forEach((e,i)=>setTimeout(()=>e.classList.remove('hide'),380+i*75));
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);} }));
  document.querySelectorAll('.about,.promo').forEach(e=>io.observe(e));
}

/* ---------- hover: tilt + glow that follows the cursor ---------- */
items.forEach(el=>{
  let t;
  el.addEventListener('pointermove',e=>{
    const r=el.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    el.style.setProperty('--mx',x+'px'); el.style.setProperty('--my',y+'px');
    if(canHover && !reduce){
      el.style.setProperty('--ry',((x/r.width)-.5)*7+'deg');
      el.style.setProperty('--rx',(.5-(y/r.height))*9+'deg');
      el.classList.add('moving'); clearTimeout(t); t=setTimeout(()=>el.classList.remove('moving'),120);
    }
  });
  el.addEventListener('pointerleave',()=>{ el.classList.remove('moving','press'); el.style.setProperty('--rx','0deg'); el.style.setProperty('--ry','0deg'); });

  /* ---------- click: press + ripple + sparks ---------- */
  el.addEventListener('pointerdown',e=>{
    el.classList.add('press');
    const r=el.getBoundingClientRect(), s=Math.max(r.width,r.height)*2.2, d=document.createElement('span');
    d.className='ripple'; d.style.width=d.style.height=s+'px'; d.style.left=(e.clientX-r.left)+'px'; d.style.top=(e.clientY-r.top)+'px';
    el.appendChild(d); setTimeout(()=>d.remove(),750);
    burst(e.clientX,e.clientY);
  });
  const up=()=>el.classList.remove('press');
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.addEventListener('click',e=>{ if(el.getAttribute('href')==='#') e.preventDefault(); });
});

/* ---------- sparks ---------- */
const fc=document.getElementById('fx'), fxc=fc.getContext('2d'); let parts=[], running=false;
function sizeFx(){ const d=devicePixelRatio||1; fc.width=innerWidth*d; fc.height=innerHeight*d; fxc.setTransform(d,0,0,d,0,0); }
sizeFx(); addEventListener('resize',sizeFx);
function burst(x,y){
  if(reduce) return;
  for(let i=0;i<18;i++){ const a=Math.random()*Math.PI*2, v=2+Math.random()*4.5;
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,r:1+Math.random()*2.2,w:Math.random()<.25}); }
  if(!running){ running=true; requestAnimationFrame(tick); }
}
function tick(){
  fxc.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){
    p.x+=p.vx; p.y+=p.vy; p.vx*=.9; p.vy=p.vy*.9+.08; p.life-=.035;
    fxc.globalAlpha=Math.max(p.life,0); fxc.fillStyle=p.w?'#fff':'#ff2b45';
    fxc.shadowColor='#ff2b45'; fxc.shadowBlur=10;
    fxc.beginPath(); fxc.arc(p.x,p.y,p.r*p.life+.3,0,6.283); fxc.fill();
  }
  fxc.globalAlpha=1;
  if(parts.length) requestAnimationFrame(tick); else { running=false; fxc.clearRect(0,0,innerWidth,innerHeight); }
}

/* ---------- deep black + film grain ---------- */
const c=document.getElementById('stars'), x=c.getContext('2d');
const tiles=[]; const TS=180;
for(let k=0;k<6;k++){ const t=document.createElement('canvas'); t.width=t.height=TS; const tx=t.getContext('2d'), im=tx.createImageData(TS,TS), d=im.data;
  for(let i=0;i<d.length;i+=4){ const v=Math.random()*255|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; } tx.putImageData(im,0,0); tiles.push(t); }
function size(){ c.width=innerWidth; c.height=innerHeight; } size(); addEventListener('resize',size);
let f=0, last=0;
function draw(t){
  if(t-last>70||!last){ last=t; const pat=x.createPattern(tiles[f++%tiles.length],'repeat');
    x.save(); x.translate(-Math.random()*TS,-Math.random()*TS); x.fillStyle=pat; x.fillRect(0,0,c.width+TS,c.height+TS); x.restore(); }
  if(!reduce) requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
